<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="gradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#eaeaea" />
        </linearGradient>
        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ccc" flood-opacity="0.5"/>
        </filter>
    </defs>

    <rect width="100%" height="100%" fill="url(#gradient)" />

    <!-- Верхние волны -->
    <path d="M0,150 Q300,190 600,80 T1000,40 T1200,0 L1200,0 L0,0 Z"
          fill="#e5e5e5" filter="url(#shadow)" />
    <path d="M0,0 Q150,100 300,0 T600,0 T900,-50 T1200,0 L1200,0 L0,0 Z"
          fill="#f5f5f5" filter="url(#shadow)" />
    <path d="M0,100 Q250,170 500,60 T900,30 T1200,0 L1200,0 L0,0 Z"
          fill="#ebebeb" filter="url(#shadow)" />
    <path d="M0,50 Q200,150 400,40 T800,30 T1200,0 L1200,0 L0,0 Z"
          fill="#f0f0f0" filter="url(#shadow)" />


    <!-- Нижние волны -->
    <path d="M0,400 Q150,300 300,400 T600,400 T900,450 T1200,400 L1200,800 L0,800 Z"
          fill="#f5f5f5" filter="url(#shadow)" />
    <path d="M0,450 Q200,350 400,460 T800,470 T1200,500 L1200,800 L0,800 Z"
          fill="#f0f0f0" filter="url(#shadow)" />
    <path d="M0,500 Q250,380 500,490 T900,520 T1200,550 L1200,800 L0,800 Z"
          fill="#ebebeb" filter="url(#shadow)" />
    <path d="M0,550 Q300,410 600,520 T1000,560 T1200,600 L1200,800 L0,800 Z"
          fill="#e5e5e5" filter="url(#shadow)" />
</svg>
